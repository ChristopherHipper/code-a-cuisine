name: Frontend CI

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # setup-node provides the right Node.js version and caches npm dependencies.
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Tests run before the build so broken code never even gets built.
      - name: Run Format
        run: npm run format:check

      - name: Run Linting
        run: npm run lint

      - name: Run tests
        run: npm test -- --watch=false

      - name: Create production build
        run: npm run build -- --base-href /angular-projects/code-a-cuisine/

      - name: Deploy via lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate false;
            mirror -R --verbose ./dist/code-a-cuisine/browser/ /angular-projects/code-a-cuisine/;
            bye"
