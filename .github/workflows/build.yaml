name: Frontend CI

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # setup-node provides the right Node.js version and caches npm dependencies.
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Tests run before the build so broken code never even gets built.
      - name: Run Format
        run: npm run format:check

      - name: Run Linting
        run: npm run lint

      - name: Run tests
        run: npm test -- --watch=false

      - name: Create production build
        run: npm run build -- --configuration production

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/code-a-cuisine/browser/
          server-dir: /angular-projects/
