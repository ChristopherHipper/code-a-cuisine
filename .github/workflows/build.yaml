name: Frontend CI

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # setup-node provides the right Node.js version and caches npm dependencies.
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Tests run before the build so broken code never even gets built.
      - name: Run Format
        run: npm run format:check

      - name: Run Linting
        run: npm run lint

      - name: Run tests
        run: npm test -- --watch=false

      - name: Create production build
        run: npm run build -- --base-href /angular-projects/

      - name: Ensure docker home writable
        run: |
          mkdir -p "$RUNNER_TEMP/_github_home"
          chmod -R 0777 "$RUNNER_TEMP/_github_home"

      - name: Deploy to FTP/FTPS
        uses: airvzxf/ftp-deployment-action@v2
        env:
          HOME: /github/workspace
        with:
          server: ${{ secrets.FTP_SERVER }}
          user: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local_dir: './dist/code-a-cuisine/browser'
          remote_dir: '/angular-projects/code-a-cuisine'
          ssl_verify_certificate: 'false'
