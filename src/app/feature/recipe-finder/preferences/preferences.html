<div class="w-full max-w-360 mx-auto px-4 pb-10 md:px-17">
  <app-header class="text-dark-green" />
  <button (click)="backToIngredients()" class="mt-4">
    <svg width="32" height="20" viewBox="0 0 32 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M26 11C26.5523 11 27 10.5523 27 10C27 9.44772 26.5523 9 26 9L26 11ZM5.29289 9.29289C4.90237 9.68342 4.90237 10.3166 5.29289 10.7071L11.6569 17.0711C12.0474 17.4616 12.6805 17.4616 13.0711 17.0711C13.4616 16.6805 13.4616 16.0474 13.0711 15.6569L7.41421 10L13.0711 4.34314C13.4616 3.95262 13.4616 3.31946 13.0711 2.92893C12.6805 2.53841 12.0474 2.53841 11.6569 2.92893L5.29289 9.29289ZM26 10L26 9L6 9L6 10L6 11L26 11L26 10Z"
        fill="#1E5515"
      />
    </svg>
  </button>

  <main
    class="flex flex-col items-center text-2xl font-semibold pt-10 text-dark-green mb-6 md:pt-12"
  >
    <h1 class="pb-6 font-medium text-3xl text-middle-green text-center md:text-5xl md:pb-14">
      Choose your preferences
    </h1>
    <section class="flex flex-col gap-6 sm:flex-row md:gap-30">
      <div>
        <p class="font-medium text-base mb-2 md:text-xl md:mb-4">How many portions you need?</p>
        <p class="flex gap-2 items-center font-medium text-lg md:text-xl">
          <button (click)="decrease(portions)">
            <svg
              width="20"
              height="20"
              viewBox="0 0 20 20"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M5.55556 11.1111H14.4444C14.7593 11.1111 15.0231 11.0046 15.2361 10.7917C15.4491 10.5787 15.5556 10.3148 15.5556 10C15.5556 9.68519 15.4491 9.4213 15.2361 9.20833C15.0231 8.99537 14.7593 8.88889 14.4444 8.88889H5.55556C5.24074 8.88889 4.97685 8.99537 4.76389 9.20833C4.55093 9.4213 4.44444 9.68519 4.44444 10C4.44444 10.3148 4.55093 10.5787 4.76389 10.7917C4.97685 11.0046 5.24074 11.1111 5.55556 11.1111ZM2.22222 20C1.61111 20 1.08796 19.7824 0.652778 19.3472C0.217593 18.912 0 18.3889 0 17.7778V2.22222C0 1.61111 0.217593 1.08796 0.652778 0.652778C1.08796 0.217593 1.61111 0 2.22222 0H17.7778C18.3889 0 18.912 0.217593 19.3472 0.652778C19.7824 1.08796 20 1.61111 20 2.22222V17.7778C20 18.3889 19.7824 18.912 19.3472 19.3472C18.912 19.7824 18.3889 20 17.7778 20H2.22222ZM2.22222 17.7778H17.7778V2.22222H2.22222V17.7778Z"
                fill="#10310B"
              />
            </svg>
          </button>
          <span
            class="flex items-center justify-center text-xl size-5.5 w-6 bg-transparent-green"
            >{{ portions() }}</span
          >
          <span>Portions</span>
          <button (click)="increase(portions, 12)">
            <svg
              width="20"
              height="20"
              viewBox="0 0 20 20"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M8.33333 11.6667V13.8889C8.33333 14.3519 8.49537 14.7454 8.81944 15.0694C9.14352 15.3935 9.53704 15.5556 10 15.5556C10.463 15.5556 10.8565 15.3935 11.1806 15.0694C11.5046 14.7454 11.6667 14.3519 11.6667 13.8889V11.6667H13.8889C14.3519 11.6667 14.7454 11.5046 15.0694 11.1806C15.3935 10.8565 15.5556 10.463 15.5556 10C15.5556 9.53704 15.3935 9.14352 15.0694 8.81944C14.7454 8.49537 14.3519 8.33333 13.8889 8.33333H11.6667V6.11111C11.6667 5.64815 11.5046 5.25463 11.1806 4.93056C10.8565 4.60648 10.463 4.44444 10 4.44444C9.53704 4.44444 9.14352 4.60648 8.81944 4.93056C8.49537 5.25463 8.33333 5.64815 8.33333 6.11111V8.33333H6.11111C5.64815 8.33333 5.25463 8.49537 4.93056 8.81944C4.60648 9.14352 4.44444 9.53704 4.44444 10C4.44444 10.463 4.60648 10.8565 4.93056 11.1806C5.25463 11.5046 5.64815 11.6667 6.11111 11.6667H8.33333ZM2.22222 20C1.61111 20 1.08796 19.7824 0.652778 19.3472C0.217593 18.912 0 18.3889 0 17.7778V2.22222C0 1.61111 0.217593 1.08796 0.652778 0.652778C1.08796 0.217593 1.61111 0 2.22222 0H17.7778C18.3889 0 18.912 0.217593 19.3472 0.652778C19.7824 1.08796 20 1.61111 20 2.22222V17.7778C20 18.3889 19.7824 18.912 19.3472 19.3472C18.912 19.7824 18.3889 20 17.7778 20H2.22222ZM2.22222 17.7778H17.7778V2.22222H2.22222V17.7778Z"
                fill="#10310B"
              />
            </svg>
          </button>
        </p>
      </div>
      <div>
        <p class="font-medium text-base mb-2 md:text-xl md:mb-4">How many are cooking?</p>
        <p class="flex gap-2 items-center font-medium text-lg md:text-xl">
          <button (click)="decrease(persons)">
            <svg
              width="20"
              height="20"
              viewBox="0 0 20 20"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M5.55556 11.1111H14.4444C14.7593 11.1111 15.0231 11.0046 15.2361 10.7917C15.4491 10.5787 15.5556 10.3148 15.5556 10C15.5556 9.68519 15.4491 9.4213 15.2361 9.20833C15.0231 8.99537 14.7593 8.88889 14.4444 8.88889H5.55556C5.24074 8.88889 4.97685 8.99537 4.76389 9.20833C4.55093 9.4213 4.44444 9.68519 4.44444 10C4.44444 10.3148 4.55093 10.5787 4.76389 10.7917C4.97685 11.0046 5.24074 11.1111 5.55556 11.1111ZM2.22222 20C1.61111 20 1.08796 19.7824 0.652778 19.3472C0.217593 18.912 0 18.3889 0 17.7778V2.22222C0 1.61111 0.217593 1.08796 0.652778 0.652778C1.08796 0.217593 1.61111 0 2.22222 0H17.7778C18.3889 0 18.912 0.217593 19.3472 0.652778C19.7824 1.08796 20 1.61111 20 2.22222V17.7778C20 18.3889 19.7824 18.912 19.3472 19.3472C18.912 19.7824 18.3889 20 17.7778 20H2.22222ZM2.22222 17.7778H17.7778V2.22222H2.22222V17.7778Z"
                fill="#10310B"
              />
            </svg>
          </button>
          <span
            class="flex items-center justify-center text-xl size-5.5 w-6 bg-transparent-green"
            >{{ persons() }}</span
          >
          <span>Person</span>
          <button (click)="increase(persons, 5)">
            <svg
              width="20"
              height="20"
              viewBox="0 0 20 20"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M8.33333 11.6667V13.8889C8.33333 14.3519 8.49537 14.7454 8.81944 15.0694C9.14352 15.3935 9.53704 15.5556 10 15.5556C10.463 15.5556 10.8565 15.3935 11.1806 15.0694C11.5046 14.7454 11.6667 14.3519 11.6667 13.8889V11.6667H13.8889C14.3519 11.6667 14.7454 11.5046 15.0694 11.1806C15.3935 10.8565 15.5556 10.463 15.5556 10C15.5556 9.53704 15.3935 9.14352 15.0694 8.81944C14.7454 8.49537 14.3519 8.33333 13.8889 8.33333H11.6667V6.11111C11.6667 5.64815 11.5046 5.25463 11.1806 4.93056C10.8565 4.60648 10.463 4.44444 10 4.44444C9.53704 4.44444 9.14352 4.60648 8.81944 4.93056C8.49537 5.25463 8.33333 5.64815 8.33333 6.11111V8.33333H6.11111C5.64815 8.33333 5.25463 8.49537 4.93056 8.81944C4.60648 9.14352 4.44444 9.53704 4.44444 10C4.44444 10.463 4.60648 10.8565 4.93056 11.1806C5.25463 11.5046 5.64815 11.6667 6.11111 11.6667H8.33333ZM2.22222 20C1.61111 20 1.08796 19.7824 0.652778 19.3472C0.217593 18.912 0 18.3889 0 17.7778V2.22222C0 1.61111 0.217593 1.08796 0.652778 0.652778C1.08796 0.217593 1.61111 0 2.22222 0H17.7778C18.3889 0 18.912 0.217593 19.3472 0.652778C19.7824 1.08796 20 1.61111 20 2.22222V17.7778C20 18.3889 19.7824 18.912 19.3472 19.3472C18.912 19.7824 18.3889 20 17.7778 20H2.22222ZM2.22222 17.7778H17.7778V2.22222H2.22222V17.7778Z"
                fill="#10310B"
              />
            </svg>
          </button>
        </p>
      </div>
    </section>
    <section class="mt-8 pt-8 pb-8 pl-3.5 pr-3.5 rounded-3xl bg-transparent-green">
      @for (preference of preferences(); track preference.id) {
        <div class="flex items-center gap-1">
          <svg
            width="20"
            height="20"
            viewBox="0 0 20 20"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path [attr.d]="preference.icon" fill="#10310B" />
          </svg>

          <h2 class="text-2xl font-semibold text-dark-green">
            {{ preference.category }}
          </h2>
        </div>
        <div class="flex flex-wrap gap-2 pt-6 pb-10 md:gap-5">
          @for (option of preference.options; track option) {
            <button
              [class.choosed]="setChoosedClass(option, preference.id)"
              (click)="selectPreference(option, preference.id)"
              class="rounded-4xl bg-cremy py-1.5 px-3 text-xl text-middle-green hover:bg-cremy-hover"
            >
              {{ option }}
            </button>
          }
        </div>
      }
    </section>
  </main>
</div>
