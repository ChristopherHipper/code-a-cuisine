<section class="mt-10" aria-labelledby="directions-heading">
  <div
    class="aspect-[calc(1152)/148] flex justify-center items-center bg-[url(/img/direction_bg.png)] bg-contain bg-no-repeat bg-top"
  >
    <h2 id="directions-heading" class="text-2xl font-semibold text-middle-green">Directions</h2>
  </div>
  <ol class="mt-6 grid gap-x-12 gap-y-8 px-6 lg:grid-cols-2 lg:px-16">
    @for (step of steps(); track step.step_number) {
      <li class="flex flex-col gap-3">
        <div class="flex items-center justify-between gap-2">
          <h3 class="flex items-center gap-2 text-lg font-semibold text-dark-green">
            <span
              class="flex size-6 items-center justify-center rounded-full bg-cremy text-xs text-olive-green"
              >{{ step.step_number }}.</span
            >
            {{ step.title }}
          </h3>
          <app-chef-badge [chef]="step.assigned_person" />
        </div>
        <p class="text-sm text-dark-green">{{ step.description }}</p>
      </li>
    }
  </ol>
</section>
