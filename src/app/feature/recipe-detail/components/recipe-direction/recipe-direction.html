<section class="mt-10" aria-labelledby="directions-heading">
  <!-- Platz für die dekorativen Bilder (NgOptimizedImage, alt="") links und rechts der Überschrift -->
  <h2
    id="directions-heading"
    class="rounded-2xl bg-cremy py-3 text-center text-2xl font-semibold text-middle-green"
  >
    Directions
  </h2>
  <ol class="mt-6 grid gap-x-12 gap-y-8 px-6 md:grid-cols-2 md:px-16">
    @for (step of steps(); track step.stepNumber) {
      <li class="flex flex-col gap-3">
        <div class="flex items-center justify-between gap-2">
          <h3 class="flex items-center gap-2 text-lg font-semibold text-dark-green">
            <span
              class="flex size-6 items-center justify-center rounded-full bg-cremy text-xs text-olive-green"
              >{{ step.stepNumber }}.</span
            >
            {{ step.title }}
          </h3>
          <app-chef-badge [chef]="step.assignedPerson" />
        </div>
        <p class="text-sm text-dark-green">{{ step.description }}</p>
      </li>
    }
  </ol>
</section>
